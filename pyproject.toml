[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license metadata
build-backend = "hatchling.build"

[project]
name = "killscore"
dynamic = ["version"]
description = "Mechanical checks for AI-written code and mutation-verified tests. Hallucinated APIs, slopsquatted dependencies, and assertions that can't fail. No LLM produces a verdict."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Suyash Kerkar" }]
keywords = ["ai", "testing", "mutation-testing", "slopsquatting", "static-analysis", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
# The base install is what a pre-commit hook needs: audit, deps, models, history, diff.
# Each extra maps to modules in killscore/extras.py; tests/test_packaging.py builds the wheel
# and asserts this exact set, so the two cannot drift.
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.2.128", "anyio>=4.0"]  # harden, baseline, deps --explain
tui = ["textual>=8.2"]
mcp = [
    "mcp>=1.29,<2",  # FastMCP verified on 1.29; 2.x renamed it (MCPServer) and changed APIs
    "anyio>=4.0",
]
all = ["killscore[agent,tui,mcp]"]

[project.urls]
Homepage = "https://github.com/Suyash728/killscore"
Repository = "https://github.com/Suyash728/killscore"
Issues = "https://github.com/Suyash728/killscore/issues"

[project.scripts]
killscore = "killscore.cli:main_entry"

[dependency-groups]
dev = [
    "killscore[all]",  # the suite covers every extra
    "coverage>=7.6",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "killscore/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["killscore"]
# node_modules is gitignored, so hatch already leaves it out; this keeps it out explicitly.
exclude = ["killscore/checks/node/node_modules"]

# The data files live at the repo root (scripts and the workflow maintain them there) and
# are copied into the wheel, so `uvx killscore` has its registry and corpora. Without this
# an installed wheel skips stale-models and scores slopsquat with no corpus.
[tool.hatch.build.targets.wheel.force-include]
"data" = "killscore/data"

[tool.hatch.build.targets.sdist]
include = ["killscore", "data", "scripts", "tests", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]
exclude = ["killscore/checks/node/node_modules"]

# Single pytest config for the whole repo.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["tests/fixtures", ".venv", "node_modules", "mutants"]
addopts = "-ra"
markers = [
    "ts_morph: needs node and the ts-morph helper; skipped with the reason when absent (tests/conftest.py)",
]

# Self-audit: these are deliberately broken sample repositories, not killscore's code.
[tool.killscore]
exclude = ["tests/fixtures"]

[tool.ruff]
line-length = 100
# Fixtures are deliberately malformed/unpinned sample repos, not project code.
extend-exclude = ["tests/fixtures"]

# One alphabetical run per section,
# with `import x` and `from x import y` interleaved by module name.
[tool.ruff.lint.isort]
force-sort-within-sections = true
lines-after-imports = 2
